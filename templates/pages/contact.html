{% extends 'base.html' %}
{% load static %}

{% block title %}Contact{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/contact.css' %}">
{% endblock %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
</head>
<body>

<div class="contact-container">
    <div class="contact-header">
        <h1>Contact Me</h1>
        <p>I'd love to hear from you! Feel free to reach out using the form below.</p>
    </div>

    <form class="contact-form">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your Name">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your Email">
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Your Message"></textarea>
        </div>

        <button type="submit">Send Message</button>
    </form>

    <div class="icons">
        <a href="https://mail.google.com/mail/u/0/#inbox?compose=DmwnWrRmTgNDkTHwdzdPLTvJgswvpVtSwCKHMVSxpsSLmjZMGkJsQMPPgRFVLgmRDHSknfVCSFQq" target="_blank">
            <div class="icon">
                <img src="{% static 'images/envelope.png' %}" alt="Envelope" />
            </div>
        </a>
        <a href="https://github.com/yangGonzaga25" target="_blank">
            <div class="icon">
                <img src="{% static 'images/github.png' %}" alt="GitHub" />
            </div>
        </a>
        <a href="https://www.reddit.com/user/Any-Acanthisitta3113/" target="_blank">
            <div class="icon">
                <img src="{% static 'images/reddit.png' %}" alt="Reddit" />
            </div>
        </a>
        <a href="https://www.facebook.com/tan.zzz7/" target="_blank">
            <div class="icon">
                <img src="{% static 'images/facebook.png' %}" alt="Facebook" />
            </div>
        </a>
    </div>

</div>

</body>
</html>
{% endblock %}
